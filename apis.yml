aid: arch-network
name: Arch Network
description: >-
  Arch Network is Bitcoin-native financial infrastructure and a computation environment that lets
  developers build DeFi and capital-markets applications — lending, yield, trading, and structured
  products — with settlement kept local to Bitcoin. It executes programmable smart contracts
  (written in Rust) over Bitcoin UTXOs using a specialized virtual machine and threshold-cryptography
  (FROST/ROAST) validator security, and exposes a JSON-RPC API with first-party TypeScript and Rust
  SDKs, a CLI, and an AI agent kit. Surfaced as a portfolio company of Multicoin Capital.
